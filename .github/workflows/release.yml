name: Package version upgrader

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release even if dependency versions are unchanged
        type: boolean
        default: false
  repository_dispatch:
    types: [upstream-release]

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check latest Codex and Inspect AI versions
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.candidate.outputs.changed }}
      version: ${{ steps.candidate.outputs.version }}
      tag: ${{ steps.candidate.outputs.tag }}
      prerelease: ${{ steps.candidate.outputs.prerelease }}
      base_sha: ${{ github.sha }}
    steps:
      - name: Check out repository source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13 and uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.13'

      - name: Install locked development dependencies with uv
        run: uv sync --locked --group dev

      - name: Check upstream dependency releases and prepare candidate updates
        id: candidate
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        run: |
          release_args=()
          if test "$RELEASE_REQUESTED" = true; then
            release_args+=(--release)
          fi
          uv run --no-sync python scripts/update_dependencies.py --output-dir "$RUNNER_TEMP/release" "${release_args[@]}"

      - name: Update uv.lock and regenerate native Codex JSON-RPC protocol bindings
        if: steps.candidate.outputs.changed == 'true'
        run: |
          uv lock
          uv sync --locked --group dev
          uv run --no-sync python scripts/generate_protocol.py

      - name: Run protocol consistency check, Ruff linter, and ty type checker
        if: steps.candidate.outputs.changed == 'true'
        run: |
          uv run --no-sync python scripts/generate_protocol.py --check
          uv run --no-sync ruff check .
          uv run --no-sync ty check

      - name: Run default test suite with real pinned Codex executable
        if: steps.candidate.outputs.changed == 'true'
        run: uv run --no-sync pytest -q --keep-failed-artifacts="$RUNNER_TEMP/failures" --junitxml="$RUNNER_TEMP/default.xml"

      - name: Pull python:3.13-slim base Docker image for container tests
        if: steps.candidate.outputs.changed == 'true'
        run: docker pull python:3.13-slim

      - name: Run container acceptance tests in Docker sandboxes
        if: steps.candidate.outputs.changed == 'true'
        run: uv run --no-sync pytest -q -m containers --keep-failed-artifacts="$RUNNER_TEMP/failures" --junitxml="$RUNNER_TEMP/containers.xml"

      - name: Build wheel and source distribution packages with uv
        if: steps.candidate.outputs.changed == 'true'
        run: uv build --no-sources --out-dir "$RUNNER_TEMP/release/dist"

      - name: Generate candidate source git diff patch for release
        if: always() && steps.candidate.outputs.changed == 'true'
        run: git diff --binary > "$RUNNER_TEMP/release/candidate.patch"

      - name: Upload verified release candidate artifacts
        if: steps.candidate.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 14

      - name: Upload test failure diagnostics, JUnit reports, and candidate artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatibility-failure
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/failures
            ${{ runner.temp }}/*.xml
            ${{ runner.temp }}/release
          if-no-files-found: ignore
          retention-days: 7

  record:
    name: Record tested pins and draft the GitHub release
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out repository at tested base commit with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.base_sha }}
          fetch-depth: 0

      - name: Download verified release candidate artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-candidate
          path: ${{ runner.temp }}/release

      - name: Apply candidate patch, create release commit and tag, and push to origin
        env:
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
          RELEASE_TAG: ${{ needs.check.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git apply --check "$RUNNER_TEMP/release/candidate.patch"
          git apply "$RUNNER_TEMP/release/candidate.patch"
          git add pyproject.toml uv.lock README.md src/inspect_codex_app_server/container.py src/inspect_codex_app_server/_generated_protocol.py src/inspect_codex_app_server/_generated_rpc.py
          expected_tree=$(git write-tree)
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            # A rerun after a partial publication must reuse the tested tree.
            test "$(git rev-parse "$RELEASE_TAG^{tree}")" = "$expected_tree"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Release inspect-codex-app-server $RELEASE_VERSION"
            git tag -a "$RELEASE_TAG" -m "Compatibility release $RELEASE_VERSION"
            # A concurrent default-branch change rejects the entire push.
            git push --atomic origin "HEAD:refs/heads/$DEFAULT_BRANCH" "refs/tags/$RELEASE_TAG"
          fi

      - name: Create or update draft GitHub release and attach distribution packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
          RELEASE_TAG: ${{ needs.check.outputs.tag }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/existing-release.json"; then
            if jq -e '.isDraft' "$RUNNER_TEMP/existing-release.json"; then
              gh release upload "$RELEASE_TAG" "$RUNNER_TEMP"/release/dist/* --clobber
            fi
          else
            options=(--verify-tag --draft --title "$RELEASE_VERSION" --notes-file "$RUNNER_TEMP/release/notes.md")
            if test "$PRERELEASE" = true; then
              options+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${options[@]}" "$RUNNER_TEMP"/release/dist/*
          fi

  publish:
    name: Publish the tested distributions to PyPI
    needs: record
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download release candidate distribution packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-candidate
          path: candidate

      - name: Publish wheel and source distribution packages to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: candidate/dist
          skip-existing: true

  release:
    name: Publish the GitHub release after PyPI succeeds
    needs: [check, publish]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.check.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false
