name: Test and quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  test:
    name: Run tests and quality checks
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out repository source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13 and uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.13'

      - name: Install locked development dependencies with uv
        run: uv sync --locked --group dev

      - name: Run protocol consistency check, Ruff linter, and ty type checker
        run: |
          uv run --no-sync python scripts/generate_protocol.py --check
          uv run --no-sync ruff check .
          uv run --no-sync ty check

      - name: Run default test suite with real pinned Codex executable
        run: uv run --no-sync pytest -q --keep-failed-artifacts="$RUNNER_TEMP/failures" --junitxml="$RUNNER_TEMP/default.xml"

      - name: Pull python:3.13-slim base Docker image for container tests
        run: docker pull python:3.13-slim

      - name: Run container acceptance tests in Docker sandboxes
        run: uv run --no-sync pytest -q -m containers --keep-failed-artifacts="$RUNNER_TEMP/failures" --junitxml="$RUNNER_TEMP/containers.xml"

      - name: Build wheel and source distribution packages with uv
        run: uv build --no-sources --out-dir "$RUNNER_TEMP/dist"

      - name: Upload test failure diagnostics and reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-failure
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/failures
            ${{ runner.temp }}/*.xml
          if-no-files-found: ignore
          retention-days: 7
